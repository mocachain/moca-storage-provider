name: BlockSyncer E2E Test

on:
  push:
    branches:
      - main
      - develop
      - fix-release*

  pull_request:
    branches:

jobs:
  e2e-test:
    strategy:
      matrix:
        go-version: [ 1.26.10 ]
        os: [ ubuntu-latest ]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      # Checkout Moca-SP
      - name: Checkout Moca-SP
        uses: actions/checkout@v4
      - name: Record test metadata
        id: metadata
        env:
          E2E_PR_NUMBER: ${{ github.event.pull_request.number }}
          E2E_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash ./test/e2e/spworkflow/e2e_test.sh --recordMetadata
      # Run MySQL
      - name: Run MySQL
        id: mysql
        run: |
          sudo systemctl start mysql.service
      # Build SP and Make Config.toml
      - name: Build and Make Config
        id: make-config
        run: |
          bash ./modular/blocksyncer/test/bs_test.sh --makecfg
      # Reset env
      - name: Reset env
        id: reset
        run: |
          bash ./modular/blocksyncer/test/bs_test.sh --reset
      # Run Test
      - name: Run Test
        id: run-test
        run: |
          mkdir -p .github/action-logs
          set -o pipefail
          bash ./modular/blocksyncer/test/bs_test.sh --start_test 2>&1 | tee .github/action-logs/bs-e2e-run-test.log
      - name: Record stage results
        if: always()
        env:
          STAGE_METADATA: ${{ steps.metadata.outcome }}
          STAGE_MYSQL: ${{ steps.mysql.outcome }}
          STAGE_MAKE_CONFIG: ${{ steps.make-config.outcome }}
          STAGE_RESET: ${{ steps.reset.outcome }}
          STAGE_RUN_TEST: ${{ steps.run-test.outcome }}
        run: |
          mkdir -p .github/action-logs
          {
            echo "stage.metadata=${STAGE_METADATA:-UNKNOWN}"
            echo "stage.mysql=${STAGE_MYSQL:-UNKNOWN}"
            echo "stage.make-config=${STAGE_MAKE_CONFIG:-UNKNOWN}"
            echo "stage.reset=${STAGE_RESET:-UNKNOWN}"
            echo "stage.run-test=${STAGE_RUN_TEST:-UNKNOWN}"
          } >> .github/action-logs/e2e-metadata.txt
      # copy this job's allowlisted logs into a static bundle and scrub keys
      # from the copy before anything leaves the runner; when this step
      # fails, no bundle exists and nothing is uploaded
      - name: Redact diagnostics
        id: redact
        if: always()
        run: |
          bash ./test/e2e/spworkflow/e2e_test.sh --redactEvidence bs-e2e
      # Only the bundle built by the Redact diagnostics step is uploaded. Its
      # allowlist (profile bs-e2e in e2e_test.sh) is the file list this step
      # used to name; never add config files, keystores, account directories,
      # SP data/ or sp.json (they hold test keys).
      - name: Upload BlockSyncer E2E diagnostics
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bs-e2e-diagnostics
          if-no-files-found: error
          retention-days: 30
          # the bundle lives under .github/, which upload-artifact@v4 skips
          # unless hidden files are enabled
          include-hidden-files: true
          path: .github/e2e-diagnostics/
